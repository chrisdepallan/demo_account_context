name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run service tests
        run: python tools/run_tests.py

      - name: Check Markdown structure and file references
        run: python tools/check_links.py

      - name: Check generated files are up to date
        run: python tools/generate_reports.py --check
