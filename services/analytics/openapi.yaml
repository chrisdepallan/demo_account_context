openapi: 3.0.3
info:
  title: Acme Cloud Analytics API
  version: 2.0.0
  description: >
    Internal API for metrics, dashboards, scheduled reports and exports.
    All data is fictional. Authenticate with an API key that starts with
    `acme_live_` (production) or `acme_test_` (sandbox).
servers:
  - url: https://api.acme-cloud.example
    description: Production
tags:
  - name: Metrics
    description: Query metric values
  - name: Dashboards
    description: Built-in and custom dashboards
  - name: Reports
    description: Scheduled reports
  - name: Exports
    description: One-off exports
security:
  - apiKey: []
paths:
  /v2/analytics/{workspace_id}/metrics:
    get:
      operationId: queryMetric
      tags: [Metrics]
      summary: Query one metric over a date range
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: metric
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MetricName'
        - name: granularity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Granularity'
        - name: from
          in: query
          required: true
          description: First day, in the workspace time zone.
          schema:
            type: string
            format: date
            example: '2026-11-01'
        - name: to
          in: query
          required: true
          description: Last day, inclusive.
          schema:
            type: string
            format: date
            example: '2026-11-07'
        - name: project_id
          in: query
          required: false
          schema:
            type: string
            example: prj_5N8K2R7D
      responses:
        '200':
          description: Metric values, one per bucket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSeries'
        '400':
          description: The date range is invalid or older than the plan's analytics history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: outside_history
                message: The Starter plan keeps 90 days of analytics history.
  /v2/analytics/{workspace_id}/dashboards:
    get:
      operationId: listDashboards
      tags: [Dashboards]
      summary: List dashboards
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Built-in dashboards and the custom dashboards the caller can see
          content:
            application/json:
              schema:
                type: object
                required: [data, custom_limit, custom_count]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dashboard'
                  custom_limit:
                    type: integer
                    nullable: true
                    description: Custom dashboard limit for the plan; null means unlimited.
                    example: 20
                  custom_count:
                    type: integer
                    example: 4
    post:
      operationId: createDashboard
      tags: [Dashboards]
      summary: Create a custom dashboard
      description: Owner, Admin or Member. At most 12 widgets.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardInput'
      responses:
        '201':
          description: Dashboard created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The plan's custom dashboard limit is reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: dashboard_limit_reached
                message: This workspace already has 3 of 3 custom dashboards allowed on the Starter plan.
  /v2/analytics/{workspace_id}/dashboards/{dashboard_id}:
    get:
      operationId: getDashboard
      tags: [Dashboards]
      summary: Get one dashboard and its widgets
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/DashboardId'
      responses:
        '200':
          description: The dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDashboard
      tags: [Dashboards]
      summary: Delete a custom dashboard
      description: The creator, the Owner or an Admin. Built-in dashboards cannot be deleted.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/DashboardId'
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/analytics/{workspace_id}/reports/schedules:
    get:
      operationId: listReportSchedules
      tags: [Reports]
      summary: List scheduled reports
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Scheduled reports
          content:
            application/json:
              schema:
                type: object
                required: [data, limit]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportSchedule'
                  limit:
                    type: integer
                    example: 10
    post:
      operationId: createReportSchedule
      tags: [Reports]
      summary: Create a scheduled report
      description: Owner or Admin only. Up to 25 recipients, all workspace members.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportScheduleInput'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSchedule'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The plan's scheduled report limit is reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: schedule_limit_reached
                message: This workspace already has 10 of 10 scheduled reports allowed on the Pro plan.
  /v2/analytics/{workspace_id}/reports/schedules/{schedule_id}:
    delete:
      operationId: deleteReportSchedule
      tags: [Reports]
      summary: Delete a scheduled report
      description: Owner or Admin only.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: schedule_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^rps_[A-Z0-9]{8}$'
            example: rps_3H8W5N1C
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/analytics/{workspace_id}/exports:
    post:
      operationId: startExport
      tags: [Exports]
      summary: Start a one-off export
      description: >
        Owner, Admin or Member. Exports of up to 10,000 rows are ready at once;
        larger exports (up to 1,000,000 rows) are prepared in the background.
        Each person can start 10 exports per hour.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportInput'
      responses:
        '202':
          description: Export accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '429':
          description: More than 10 exports started in the last hour
          headers:
            Retry-After:
              description: Seconds until another export may be started.
              schema:
                type: integer
                example: 1200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: export_rate_limited
                message: Each person can start up to 10 exports per hour.
  /v2/analytics/{workspace_id}/exports/{export_id}:
    get:
      operationId: getExport
      tags: [Exports]
      summary: Get export status and download link
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: export_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^exp_[A-Z0-9]{8}$'
            example: exp_6T4R8B2J
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: API key with the prefix `acme_live_` or `acme_test_`.
  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ws_[A-Z0-9]{6}$'
        example: ws_4H8P2L
    DashboardId:
      name: dashboard_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^dsh_[A-Z0-9]{8}$'
        example: dsh_7Q2M9K4T
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: No dashboard with that ID exists in this workspace.
    Forbidden:
      description: The caller's role may not do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: forbidden
            message: Only the Owner and Admins can manage scheduled reports.
  schemas:
    MetricName:
      type: string
      enum:
        - active_members_daily
        - active_members_weekly
        - active_members_monthly
        - tasks_created
        - tasks_completed
        - task_completion_rate
        - cycle_time_median
        - cycle_time_p85
        - lead_time_median
        - overdue_rate
        - seat_utilisation
        - storage_used_bytes
      example: task_completion_rate
    Granularity:
      type: string
      enum: [daily, weekly, monthly]
      default: daily
      example: weekly
    MetricSeries:
      type: object
      required: [metric, granularity, unit, points]
      properties:
        metric:
          $ref: '#/components/schemas/MetricName'
        granularity:
          $ref: '#/components/schemas/Granularity'
        unit:
          type: string
          enum: [count, percent, days, bytes]
          example: percent
        refreshed_at:
          type: string
          format: date-time
          example: '2026-11-26T10:15:00Z'
        points:
          type: array
          items:
            type: object
            required: [bucket_start, value, final]
            properties:
              bucket_start:
                type: string
                format: date
                example: '2026-11-02'
              value:
                type: number
                nullable: true
                description: Null when the metric is undefined for the bucket.
                example: 75.0
              final:
                type: boolean
                description: True once 48 hours have passed since the bucket ended.
                example: true
    Widget:
      type: object
      required: [type, metric]
      properties:
        type:
          type: string
          enum: [number, line_chart, bar_chart, table, burndown]
          example: line_chart
        metric:
          $ref: '#/components/schemas/MetricName'
        title:
          type: string
          example: Completion rate by week
        range_days:
          type: integer
          example: 28
        project_id:
          type: string
          nullable: true
          example: prj_5N8K2R7D
    DashboardInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Launch readiness
        shared:
          type: boolean
          default: false
          example: false
        widgets:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/Widget'
    Dashboard:
      allOf:
        - $ref: '#/components/schemas/DashboardInput'
        - type: object
          required: [id, built_in, created_at]
          properties:
            id:
              type: string
              example: dsh_7Q2M9K4T
            built_in:
              type: boolean
              example: false
            created_at:
              type: string
              format: date-time
              example: '2026-10-14T13:20:00Z'
    ReportScheduleInput:
      type: object
      required: [report_type, cadence, format, recipients]
      properties:
        report_type:
          type: string
          enum: [workspace_summary, project_progress, team_workload, usage]
          example: project_progress
        cadence:
          type: string
          enum: [daily, weekly, monthly]
          example: weekly
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Weekly only. 0 is Monday.
          example: 0
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          description: Monthly only. Sent on the last day of shorter months.
          example: 1
        send_hour:
          type: integer
          minimum: 0
          maximum: 23
          default: 8
          description: Whole hour in the workspace time zone.
          example: 8
        format:
          type: string
          enum: [pdf, csv, xlsx]
          example: pdf
        recipients:
          type: array
          minItems: 1
          maxItems: 25
          description: Member emails. Guests and outside addresses are rejected.
          items:
            type: string
            format: email
          example: [member.one@customer.example, member.two@customer.example]
    ReportSchedule:
      allOf:
        - $ref: '#/components/schemas/ReportScheduleInput'
        - type: object
          required: [id, paused, next_run_at]
          properties:
            id:
              type: string
              example: rps_3H8W5N1C
            paused:
              type: boolean
              example: false
            consecutive_failures:
              type: integer
              description: The schedule pauses itself at 3.
              example: 0
            next_run_at:
              type: string
              format: date-time
              example: '2026-11-30T08:00:00Z'
    ExportInput:
      type: object
      required: [report_type, format, from, to]
      properties:
        report_type:
          type: string
          enum: [workspace_summary, project_progress, team_workload, usage]
          example: team_workload
        format:
          type: string
          enum: [pdf, csv, xlsx]
          example: csv
        from:
          type: string
          format: date
          example: '2026-10-01'
        to:
          type: string
          format: date
          example: '2026-10-31'
    Export:
      type: object
      required: [id, state, format]
      properties:
        id:
          type: string
          example: exp_6T4R8B2J
        state:
          type: string
          enum: [queued, running, ready, failed, expired]
          example: ready
        format:
          type: string
          enum: [pdf, csv, xlsx]
          example: csv
        row_count:
          type: integer
          example: 4210
        download_url:
          type: string
          format: uri
          nullable: true
          example: https://api.acme-cloud.example/v2/analytics/ws_4H8P2L/exports/exp_6T4R8B2J/download
        expires_at:
          type: string
          format: date-time
          description: 7 days after the export became ready.
          example: '2026-12-03T10:20:00Z'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string
          example: No dashboard with that ID exists in this workspace.
