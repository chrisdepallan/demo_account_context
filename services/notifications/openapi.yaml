openapi: 3.0.3
info:
  title: Acme Cloud Notifications API
  version: 2.0.0
  description: >
    Internal API of the Notifications service: in-app inbox, user preferences,
    workspace defaults, sending and email suppressions. All data is fictional.
servers:
  - url: https://api.acme-cloud.example
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Inbox
  - name: Preferences
  - name: Sending
  - name: Suppressions
paths:
  /v2/notifications/{account_id}/inbox:
    get:
      tags: [Inbox]
      operationId: listInbox
      summary: List the calling user's in-app notifications
      description: Returns notifications from the last 90 days, newest first.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: unread_only
          in: query
          schema: {type: boolean, default: false}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v2/notifications/{account_id}/inbox/{notification_id}/read:
    post:
      tags: [Inbox]
      operationId: markNotificationRead
      summary: Mark one notification as read
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: notification_id
          in: path
          required: true
          schema: {type: string, pattern: '^ntf_[A-Z0-9]{10}$'}
          example: ntf_8K2M4Q7T1X
      responses:
        '200':
          description: The updated notification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notification'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v2/notifications/{account_id}/inbox/read-all:
    post:
      tags: [Inbox]
      operationId: markAllRead
      summary: Mark every notification of the calling user as read
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Number of notifications that were marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked_read: {type: integer, example: 14}
  /v2/notifications/{account_id}/preferences:
    get:
      tags: [Preferences]
      operationId: getPreferences
      summary: Get the calling user's notification preferences
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Stored preferences (only settings the user changed appear under channels)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
    put:
      tags: [Preferences]
      operationId: replacePreferences
      summary: Replace the calling user's notification preferences
      description: >
        Email and in-app cannot be turned off for security_alert, billing_alert
        and account_notice; such a request is rejected with 422.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Preferences'}
      responses:
        '200':
          description: The saved preferences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '422': {$ref: '#/components/responses/Invalid'}
  /v2/notifications/{account_id}/workspaces/{workspace_id}/defaults:
    get:
      tags: [Preferences]
      operationId: getWorkspaceDefaults
      summary: Get the notification defaults of a workspace
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace defaults
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceDefaults'}
    put:
      tags: [Preferences]
      operationId: replaceWorkspaceDefaults
      summary: Replace the notification defaults of a workspace (Owner and Admin only)
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceDefaults'}
      responses:
        '200':
          description: The saved defaults
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceDefaults'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /v2/notifications/{account_id}/send:
    post:
      tags: [Sending]
      operationId: sendNotification
      summary: Send a notification (internal services only)
      description: >
        Limited to 600 requests per minute per calling service and account, and
        100 recipients per request. Preferences, quiet hours and rate limits
        are applied per recipient.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendRequest'}
      responses:
        '202':
          description: Accepted; one result per recipient
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema: {type: integer, example: 12}
              description: Seconds to wait before retrying
  /v2/notifications/{account_id}/suppressions:
    get:
      tags: [Suppressions]
      operationId: listSuppressions
      summary: List suppressed email addresses of an account (support agents only)
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Suppressed addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Suppression'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Internal service token or user session token.
  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      schema: {type: string, pattern: '^acc_[A-Z0-9]{8}$'}
      example: acc_7F3K9Q2M
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: {type: string, pattern: '^ws_[A-Z0-9]{6}$'}
      example: ws_4H8P2L
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: The caller's role may not perform this action
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Not found, or older than the 90-day retention
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Invalid:
      description: Validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    NotificationType:
      type: string
      enum:
        - mention
        - task_assigned
        - task_due_soon
        - task_completed
        - comment_added
        - file_shared
        - member_joined
        - storage_warning
        - security_alert
        - billing_alert
        - account_notice
      example: task_assigned
    Channel:
      type: string
      enum: [email, in_app, push]
    ChannelSettings:
      type: object
      description: Only the channels that were explicitly set are present.
      properties:
        email: {type: boolean}
        in_app: {type: boolean}
        push: {type: boolean}
      example: {email: false, push: true}
    ChannelMatrix:
      type: object
      description: Map of notification type to channel settings.
      additionalProperties: {$ref: '#/components/schemas/ChannelSettings'}
      example:
        task_completed: {email: true}
        mention: {push: false}
    Notification:
      type: object
      required: [id, type, title, created_at]
      properties:
        id: {type: string, example: ntf_8K2M4Q7T1X}
        type: {$ref: '#/components/schemas/NotificationType'}
        title: {type: string, example: A task was assigned to you}
        body: {type: string, example: '"Prepare launch checklist" is due on 2026-12-01.'}
        workspace_id: {type: string, example: ws_4H8P2L}
        project_id: {type: string, nullable: true, example: prj_5T8N2W6R}
        task_id: {type: string, nullable: true, example: tsk_9D3F7H2K}
        file_id: {type: string, nullable: true, example: null}
        channels:
          type: array
          items: {$ref: '#/components/schemas/Channel'}
          example: [email, in_app]
        created_at: {type: string, format: date-time, example: '2026-11-26T14:03:00Z'}
        read_at: {type: string, format: date-time, nullable: true, example: null}
    NotificationList:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Notification'}
        unread_count: {type: integer, example: 3}
        next_cursor: {type: string, nullable: true, example: null}
    QuietHours:
      type: object
      properties:
        enabled: {type: boolean, default: false, example: true}
        start: {type: string, description: 'Local time, 15-minute steps', default: '22:00', example: '22:00'}
        end: {type: string, description: 'Local time, 15-minute steps', default: '07:00', example: '07:00'}
    Preferences:
      type: object
      properties:
        digest_frequency:
          type: string
          enum: ['off', daily, weekly]
          default: daily
          example: weekly
        time_zone:
          type: string
          readOnly: true
          description: Taken from the user profile; UTC when not set.
          example: Europe/Berlin
        quiet_hours: {$ref: '#/components/schemas/QuietHours'}
        channels: {$ref: '#/components/schemas/ChannelMatrix'}
    WorkspaceDefaults:
      type: object
      properties:
        workspace_id: {type: string, readOnly: true, example: ws_4H8P2L}
        channels: {$ref: '#/components/schemas/ChannelMatrix'}
        updated_at: {type: string, format: date-time, readOnly: true, example: '2026-11-20T09:15:00Z'}
    SendRequest:
      type: object
      required: [type, recipients, title]
      properties:
        type: {$ref: '#/components/schemas/NotificationType'}
        recipients:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, format: email}
          example: [member@customer.example]
        title: {type: string, maxLength: 200, example: A task was assigned to you}
        body: {type: string, maxLength: 2000, example: '"Prepare launch checklist" is due on 2026-12-01.'}
        workspace_id: {type: string, example: ws_4H8P2L}
        project_id: {type: string, example: prj_5T8N2W6R}
        task_id: {type: string, example: tsk_9D3F7H2K}
        actor:
          type: string
          format: email
          description: The person who caused the event; they are never notified about it.
          example: admin@customer.example
    SendResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              recipient: {type: string, example: member@customer.example}
              notification_id: {type: string, nullable: true, example: ntf_8K2M4Q7T1X}
              decisions:
                type: object
                description: Per channel one of send, hold, digest or skipped.
                additionalProperties:
                  type: string
                  enum: [send, hold, digest, skipped]
                example: {email: hold, in_app: send, push: hold}
    Suppression:
      type: object
      properties:
        email: {type: string, format: email, example: member@customer.example}
        reason:
          type: string
          enum: [hard_bounce, soft_bounce, complaint]
          example: soft_bounce
        created_at: {type: string, format: date-time, example: '2026-11-22T06:40:00Z'}
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Set for soft_bounce only (7 days after created_at).
          example: '2026-11-29T06:40:00Z'
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: mandatory_channel}
        message: {type: string, example: email cannot be turned off for security_alert}
