# Default configuration for the Files service (fictional).
# Values here must match the docs in services/files/docs/.
# Secrets are never stored in this file: they are read from the environment
# variables named under `secrets_from_env`.

service:
  name: files
  api_base_path: /v2/files
  port: 8083
  default_region: us-east
  owner_team: Storage Platform

http:
  request_timeout_seconds: 30
  upload_chunk_timeout_seconds: 300
  download_url_ttl_seconds: 900
  default_page_size: 50
  max_page_size: 200

uploads:
  single_request_max_mb: 100          # larger files must use an upload session
  chunk_size_default_mb: 8
  chunk_size_min_mb: 5
  chunk_size_max_mb: 64
  session_expiry_hours: 24
  parallel_uploads_per_client: 4
  max_files_per_batch: 500
  checksum_algorithm: sha256
  blocked_extensions: [".exe", ".bat", ".cmd", ".scr", ".msi", ".vbs"]
  malware_scan:
    enabled: true
    quarantine_retention_days: 14

naming:
  name_max_chars: 255
  folder_max_depth: 20
  folder_max_items: 50000

# Per-plan limits. Sizes use binary units (1 GB = 1,024 MB, 1 TB = 1,024 GB).
# null means unlimited / no expiry required.
plans:
  free:
    storage_gb_total: 2               # fixed total, not per seat
    max_file_mb: 250
    version_history_days: 7
    public_link_access: [view]
    public_link_default_expiry_days: 7
    public_link_max_expiry_days: 7
    link_passwords: false
    storage_packs_allowed: false
  starter:
    storage_gb_per_seat: 10
    max_file_mb: 250
    version_history_days: 30
    public_link_access: [view, comment]
    public_link_default_expiry_days: 30
    public_link_max_expiry_days: 30
    link_passwords: true
    storage_packs_allowed: true
  pro:
    storage_gb_per_seat: 50
    max_file_mb: 5120                 # 5 GB
    version_history_days: 180
    public_link_access: [view, comment, edit]
    public_link_default_expiry_days: 30
    public_link_max_expiry_days: 365
    link_passwords: true
    storage_packs_allowed: true
  business:
    storage_gb_per_seat: 200
    max_file_mb: 5120
    version_history_days: 365
    public_link_access: [view, comment, edit]
    public_link_default_expiry_days: 30
    public_link_max_expiry_days: null
    link_passwords: true
    storage_packs_allowed: true
  enterprise:
    storage_gb_per_seat: 1024         # 1 TB
    max_file_mb: 5120
    version_history_days: null
    public_link_access: [view, comment, edit]
    public_link_default_expiry_days: 30
    public_link_max_expiry_days: null
    link_passwords: true
    storage_packs_allowed: true

quotas:
  warning_threshold_percent: 90       # email to Owner and Admins, banner in Files
  block_threshold_percent: 100        # new uploads and versions blocked
  usage_refresh_minutes: 15
  storage_pack_gb: 100                # $10/month each, billed by the Billing service
  storage_packs_max_per_account: 50

versioning:
  max_versions_per_file: 100          # includes the current version
  downgrade_prune_within_hours: 24

trash:
  retention_days: 30
  counts_towards_quota: true

share_links:
  max_active_links_per_file: 50
  password_min_chars: 8
  failed_password_attempts_before_lock: 5
  lock_minutes: 15
  revocation_max_seconds: 60

feature_flags:
  resumable_uploads: true
  malware_scanning: true
  public_links: true                  # workspace Admins can also turn this off
  require_password_on_public_links: false   # workspace-level policy, off by default
  desktop_sync: true

# Each workspace lives in exactly one region, fixed at creation.
# Files never leave the region's bucket.
regions:
  us-east:
    enabled: true
    plans: [free, starter, pro, business, enterprise]
    bucket: acme-cloud-files-us-east
    upload_endpoint: https://api.acme-cloud.example
    scan_workers: 16
  eu-central:
    enabled: true
    plans: [business, enterprise]
    bucket: acme-cloud-files-eu-central
    upload_endpoint: https://api.acme-cloud.example
    scan_workers: 8
  ap-south:
    enabled: true
    plans: [enterprise]
    bucket: acme-cloud-files-ap-south
    upload_endpoint: https://api.acme-cloud.example
    scan_workers: 4

dependencies:
  accounts_base_url: https://api.acme-cloud.example/v2/accounts
  billing_base_url: https://api.acme-cloud.example/v2/billing
  timeout_seconds: 5
  retries: 2

secrets_from_env:
  object_store_access_key: FILES_OBJECT_STORE_ACCESS_KEY
  object_store_secret_key: FILES_OBJECT_STORE_SECRET_KEY
  link_signing_key: FILES_LINK_SIGNING_KEY
  database_password: FILES_DB_PASSWORD

logging:
  level: info
  format: json
