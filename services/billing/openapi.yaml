openapi: 3.0.3
info:
  title: Acme Cloud Billing API
  version: 2.4.0
  description: >
    Internal API of the Billing service: subscriptions, proration previews,
    invoices, refunds, credits and payment status. All data is fictional.
  contact:
    name: Revenue Engineering
    email: billing@acme-cloud.example
servers:
  - url: https://api.acme-cloud.example
    description: Production
security:
  - apiKey: []
tags:
  - name: Subscription
  - name: Invoices
  - name: Refunds and credits
  - name: Payments
paths:
  /v2/billing/{account_id}/subscription:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Subscription]
      operationId: getSubscription
      summary: Get the subscription of an account
      responses:
        '200':
          description: The current subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Subscription]
      operationId: updateSubscription
      summary: Change plan, seats or billing cycle
      description: >
        Upgrades and added seats are charged immediately, prorated by day.
        Removed seats give a credit on the next invoice. Downgrades and a
        switch from annual to monthly are scheduled for the end of the period.
        Blocked with 409 while the account is past_due or read_only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionChange'
            example:
              seats: 16
      responses:
        '200':
          description: The updated subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v2/billing/{account_id}/subscription/preview:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Subscription]
      operationId: previewSubscriptionChange
      summary: Preview the prorated charge or credit of a change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionChange'
            example:
              seats: 16
      responses:
        '200':
          description: Proration preview; nothing is charged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProrationPreview'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v2/billing/{account_id}/invoices:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List invoices, newest first
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A page of invoices
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  next_cursor:
                    type: string
                    nullable: true
                    example: null
  /v2/billing/{account_id}/invoices/{invoice_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^INV-\d{4}-\d{6}$'
        example: INV-2026-004812
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Get one invoice
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/billing/{account_id}/refunds:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Refunds and credits]
      operationId: createRefund
      summary: Issue a refund (support agents only)
      description: >
        Approval limits: any support agent up to 500 USD, support team lead
        from 500.01 to 5,000 USD, billing manager above 5,000 USD. Goodwill
        refunds need a team lead at any amount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '201':
          description: Refund created with status pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '403':
          description: The caller may not approve a refund of this amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: approval_required
                message: Refunds over 500.00 USD need a support team lead.
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v2/billing/{account_id}/credits:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Refunds and credits]
      operationId: listCredits
      summary: Get the credit balance and credit entries
      responses:
        '200':
          description: Balance and ledger entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalance'
    post:
      tags: [Refunds and credits]
      operationId: createCredit
      summary: Add account credit (support agents only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditRequest'
      responses:
        '201':
          description: Credit entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditEntry'
        '403':
          description: The caller may not approve a credit of this amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/billing/{account_id}/payment-status:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Payments]
      operationId: getPaymentStatus
      summary: Get the failed-payment (dunning) state of an account
      responses:
        '200':
          description: Payment status and retry schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: API key with the prefix `acme_live_` or `acme_test_`.
  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^acc_[A-Z0-9]{8}$'
      example: acc_7F3K9Q2M
  responses:
    NotFound:
      description: Account or invoice not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_found
            message: No invoice INV-2026-009999 on this account.
    Conflict:
      description: The change is blocked by the current account state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: payment_overdue
            message: Subscription changes are blocked while the account is past_due.
    Unprocessable:
      description: The request is valid JSON but breaks a billing rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: seat_limit_exceeded
            message: Starter allows at most 10 seats.
  schemas:
    Plan:
      type: string
      enum: [free, starter, pro, business, enterprise]
      example: pro
    BillingCycle:
      type: string
      enum: [monthly, annual]
      example: monthly
    Currency:
      type: string
      enum: [USD, EUR, GBP, INR]
      example: USD
    InvoiceStatus:
      type: string
      enum: [open, paid, past_due, refunded, void]
      example: paid
    Subscription:
      type: object
      required: [account_id, plan, billing_cycle, seats, currency, status]
      properties:
        account_id:
          type: string
          example: acc_7F3K9Q2M
        plan:
          $ref: '#/components/schemas/Plan'
        billing_cycle:
          $ref: '#/components/schemas/BillingCycle'
        seats:
          type: integer
          example: 12
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          type: string
          enum: [active, past_due, read_only, cancelled]
          example: active
        current_period_start:
          type: string
          format: date
          example: '2026-11-01'
        current_period_end:
          type: string
          format: date
          example: '2026-12-01'
        cancel_at_period_end:
          type: boolean
          example: false
        scheduled_change:
          allOf:
            - $ref: '#/components/schemas/SubscriptionChange'
          nullable: true
        discount:
          type: string
          nullable: true
          enum: [nonprofit, education, startup, null]
          example: null
        payment_method_token:
          type: string
          description: Opaque token; card details are held by the payment processor.
          example: pm_4K2N8Q
    SubscriptionChange:
      type: object
      minProperties: 1
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        seats:
          type: integer
          minimum: 1
          example: 16
        billing_cycle:
          $ref: '#/components/schemas/BillingCycle'
        cancel_at_period_end:
          type: boolean
          example: false
    ProrationPreview:
      type: object
      required: [kind, amount, currency, remaining_days, cycle_days, effective]
      properties:
        kind:
          type: string
          enum: [charge, credit, none]
          example: charge
        amount:
          type: string
          description: Decimal amount before tax.
          example: '30.00'
        currency:
          $ref: '#/components/schemas/Currency'
        remaining_days:
          type: integer
          example: 15
        cycle_days:
          type: integer
          example: 30
        effective:
          type: string
          enum: [immediately, end_of_period]
          example: immediately
    Invoice:
      type: object
      required: [invoice_id, account_id, plan, billing_cycle, seats, currency, subtotal, tax, total, status, issued_at]
      properties:
        invoice_id:
          type: string
          example: INV-2026-004812
        account_id:
          type: string
          example: acc_7F3K9Q2M
        plan:
          $ref: '#/components/schemas/Plan'
        billing_cycle:
          $ref: '#/components/schemas/BillingCycle'
        seats:
          type: integer
          example: 12
        currency:
          $ref: '#/components/schemas/Currency'
        subtotal:
          type: number
          example: 180.0
        tax:
          type: number
          example: 14.85
        credit_applied:
          type: number
          example: 0.0
        total:
          type: number
          example: 194.85
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        issued_at:
          type: string
          format: date
          example: '2026-10-01'
    RefundRequest:
      type: object
      required: [invoice_id, amount, reason, ticket_id]
      properties:
        invoice_id:
          type: string
          example: INV-2026-004812
        amount:
          type: string
          example: '194.85'
        reason:
          type: string
          enum: [annual_within_30_days, duplicate_charge, charged_after_cancel, goodwill]
          example: duplicate_charge
        ticket_id:
          type: string
          example: SUP-58213
    Refund:
      type: object
      properties:
        refund_id:
          type: string
          example: rfd_8H2M4T7W
        invoice_id:
          type: string
          example: INV-2026-004812
        amount:
          type: string
          example: '194.85'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          type: string
          enum: [pending, succeeded, failed]
          example: pending
        approver_role:
          type: string
          enum: [support_agent, support_team_lead, billing_manager]
          example: support_agent
        ticket_id:
          type: string
          example: SUP-58213
        created_at:
          type: string
          format: date-time
          example: '2026-11-26T15:04:00Z'
    CreditRequest:
      type: object
      required: [amount, reason, ticket_id]
      properties:
        amount:
          type: string
          example: '29.00'
        reason:
          type: string
          enum: [sla_credit, goodwill, refund_bounced, billing_correction]
          example: sla_credit
        ticket_id:
          type: string
          example: SUP-58213
    CreditEntry:
      type: object
      properties:
        credit_id:
          type: string
          example: crd_5P9X2K6D
        amount:
          type: string
          example: '29.00'
        currency:
          $ref: '#/components/schemas/Currency'
        source:
          type: string
          enum: [seats_removed, sla_credit, goodwill, refund_bounced, billing_correction]
          example: seats_removed
        applied_to_invoice:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: '2026-11-21T09:30:00Z'
    CreditBalance:
      type: object
      properties:
        balance:
          type: string
          example: '29.00'
        currency:
          $ref: '#/components/schemas/Currency'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CreditEntry'
    PaymentStatus:
      type: object
      properties:
        status:
          type: string
          enum: [active, past_due, read_only, downgraded_to_free]
          example: past_due
        failed_on:
          type: string
          format: date
          nullable: true
          example: '2026-11-02'
        days_since_failure:
          type: integer
          nullable: true
          example: 4
        next_retry_on:
          type: string
          format: date
          nullable: true
          example: '2026-11-09'
        read_only_on:
          type: string
          format: date
          nullable: true
          example: '2026-11-16'
        downgrade_on:
          type: string
          format: date
          nullable: true
          example: '2026-12-16'
        outstanding_invoice_id:
          type: string
          nullable: true
          example: INV-2026-005120
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string
          example: Account not found.
